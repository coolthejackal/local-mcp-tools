<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MCP UI</title>
  <style>
    body { font-family: Arial; margin: 20px; }
    textarea { width: 100%; height: 100px; }
    button { margin: 5px; padding: 8px 12px; }
    pre { background: #111; color: #0f0; padding: 10px; overflow: auto; }
  </style>
</head>
<body>

<h2>MCP Context UI</h2>

<textarea id="query" placeholder="Enter query..."></textarea>

<div>
  <button onclick="build()">Build</button>
  <button onclick="callApi('smart')">Smart</button>
  <button onclick="callApi('final')">Final</button>
  <button onclick="callApi('functions')">Functions</button>
  <button onclick="callApi('deep')">Deep</button>
  <button onclick="callApi('debug')">Debug</button>
  <button onclick="callApi('plugins')">Plugins</button>
</div>

<pre id="output"></pre>

<script>
const BASE = "http://localhost:4000"

async function build() {
  const res = await fetch(BASE + "/context/build", { method: "POST" })
  const json = await res.json()
  render(json)
}

async function callApi(type) {
  const query = document.getElementById("query").value

  const payload = type === "deep"
    ? { entry: query }
    : { query }

  const res = await fetch(BASE + "/context/" + type, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  })

  const json = await res.json()
  render(json)
}

function render(data) {
  document.getElementById("output").textContent =
    JSON.stringify(data, null, 2)
}
</script>

</body>
</html>
